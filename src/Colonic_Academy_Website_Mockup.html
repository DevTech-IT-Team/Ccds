      &lt;div class=&quot;cc-copy&quot;&gt;
        &lt;div class=&quot;cc-kicker&quot;&gt;Meet Your Instructor&lt;/div&gt;
        &lt;h2&gt;Professional guidance. Practical experience. Personal support.&lt;/h2&gt;
        &lt;p&gt;Lisa Smith is the founder of Colorado Colonics and a co-founder and instructor at Colonic Academy in Englewood, Colorado. She is an NBCHT Credentialed Colon Hydrotherapist and a Certified Professional I-ACT Instructor committed to advancing education, professionalism, and high standards within the colon hydrotherapy field.&lt;/p&gt;
        &lt;p&gt;Through Colonic Academy, Lisa prepares future practitioners with comprehensive instruction that combines foundational knowledge, hands-on clinical experience, professional ethics, and practical guidance for working confidently with clients. Her teaching approach emphasizes competency, safety, individualized support, and respect for every student’s learning process.&lt;/p&gt;
        &lt;p&gt;Lisa served I-ACT as Secretary/Treasurer from 2023 to 2025 and currently serves as Vice President for the 2025–2027 term. Her leadership, practical experience, and enthusiasm for education reflect her dedication to aspiring practitioners and the continued growth of the profession.&lt;/p&gt;
        &lt;div class=&quot;cc-credentials&quot;&gt;&lt;span class=&quot;cc-chip&quot;&gt;NBCHT Credentialed&lt;/span&gt;&lt;span class=&quot;cc-chip&quot;&gt;Certified Professional I-ACT Instructor&lt;/span&gt;&lt;span class=&quot;cc-chip&quot;&gt;Co-Founder, Colonic Academy&lt;/span&gt;&lt;span class=&quot;cc-chip&quot;&gt;I-ACT Vice President, 2025–2027&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

    closeTooltip(false);

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??

    }

    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
